<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>李群科普动画 · 渲染器</title>
<!-- 只在本机渲染视频时用：逐帧调用 renderAt(t)，再截图。KaTeX 从本地 node_modules 读，不联网。 -->
<link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css">
<style>
:root {
  --paper: #ecebe3; --ink: #1b1c1a; --ink-soft: #4c4e4a; --ink-pale: #8b8d86; --cinnabar: #ad3324; --seal-text: #f3ece0;
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", serif;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
}
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
#cv { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.ov { position: absolute; opacity: 0; color: var(--ink); }
#title { left: 110px; top: 66px; display: flex; align-items: center; gap: 24px; }
#title .seal { display: grid; place-items: center; width: 74px; height: 74px; background: var(--cinnabar); color: var(--seal-text); font-family: var(--brush); font-size: 50px; line-height: 1; border-radius: 8px 5px 10px 5px; transform: rotate(-3deg); }
#title h1 { margin: 0; font-family: var(--brush); font-weight: 400; font-size: 58px; letter-spacing: .04em; }
.fx { position: absolute; opacity: 0; color: var(--ink); white-space: nowrap; }
.fx.c { transform: translateX(-50%); text-align: center; }
.fx .katex { font-size: 1em; }
.fx.cap { font-family: var(--serif); color: var(--ink-soft); }
.fx.red { color: var(--cinnabar); }
.fx.big { font-family: var(--brush); }
#sub { left: 50%; bottom: 46px; width: 1640px; text-wrap: balance; transform: translateX(-50%); text-align: center; font: 40px/1.45 var(--serif); letter-spacing: .02em;
  text-shadow: 0 0 6px var(--paper), 0 0 12px var(--paper), 0 0 18px var(--paper), 0 0 2px var(--paper); }
#corner { position: absolute; right: 64px; top: 52px; font: 22px var(--serif); letter-spacing: .2em; color: var(--ink-pale); }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="title" class="ov"><span class="seal"></span><h1></h1></div>
<div id="fxs"></div>
<div id="sub" class="ov"></div>
<div id="corner">李群图解 · Lie Group Graph</div>
<script src="../node_modules/katex/dist/katex.min.js"></script>
<script src="../source/lie.js"></script>
<script>document.write('<script src="out/' + (new URLSearchParams(location.search).get("tl") || "timeline.js").replace(/[^\w.-]/g, "") + '"><\/script>');</script>
<script src="renderer.js"></script>
</body>
</html>
